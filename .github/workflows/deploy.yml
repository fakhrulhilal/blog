name: Deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-blog
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun --bun run build

      # Same-repo deploy: pushes dist/ to this repo's own gh-pages branch,
      # using the default GITHUB_TOKEN (no PAT needed). Pages is configured
      # to serve from that branch (Settings -> Pages -> Deploy from a branch).
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          cname: blog.iroel.xyz
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
